# ---- Prefix ----
# Ctrl-A is much easier to reach than Ctrl-B (default).
unbind C-b
set -g prefix C-a
bind C-a send-prefix         # press Ctrl-A twice to send a literal Ctrl-A

# ---- Mouse ----
# Click to focus panes/tabs, scroll, drag-resize splits.
set -g mouse on

# ---- Numbering ----
# Windows start at 1 so they line up with iTerm's Cmd+1 / 2 / 3.
set -g base-index 1
set -g renumber-windows on   # close a window → others renumber to fill the gap

# ---- Behaviour ----
set -g history-limit 50000   # ~5 screens of scrollback isn't enough
set -sg escape-time 10       # avoid the half-second pause after pressing Esc

# ---- Splits ----
# `|` and `-` are visually obvious. New panes default to the window's
# @worktree-root option (set by tmux-sessionizer) so they always open at the
# worktree root regardless of where the parent pane cd'd to. Falls back to
# pane_current_path for any window without that option.
unbind '"'
unbind %
bind | split-window -h -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"
bind - split-window -v -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"
bind c new-window     -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"

# ---- Vim-style pane navigation (prefix + h/j/k/l) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Reload config in place ----
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
