# ---- Prefix ----
# Ctrl-A is much easier to reach than Ctrl-B (default).
unbind C-b
set -g prefix C-a
bind C-a send-prefix         # press Ctrl-A twice to send a literal Ctrl-A

# ---- Mouse ----
# Click to focus panes/tabs, scroll, drag-resize splits.
set -g mouse on

# ---- Numbering ----
# Windows start at 1 so they line up with iTerm's Cmd+1 / 2 / 3.
set -g base-index 1
set -g renumber-windows on   # close a window → others renumber to fill the gap

# ---- Window naming ----
# Don't let tmux auto-rename windows based on the running process; we set
# the name explicitly (to the worktree path) in tmux-sessionizer.
set -g automatic-rename off
set -g allow-rename off

# ---- Behaviour ----
set -g history-limit 50000   # ~5 screens of scrollback isn't enough
set -sg escape-time 10       # avoid the half-second pause after pressing Esc

# ---- Splits ----
# `|` and `-` are visually obvious. New panes default to the window's
# @worktree-root option (set by tmux-sessionizer) so they always open at the
# worktree root regardless of where the parent pane cd'd to. Falls back to
# pane_current_path for any window without that option.
unbind '"'
unbind %
bind | split-window -h -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"
bind - split-window -v -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"
bind c new-window     -c "#{?@worktree-root,#{@worktree-root},#{pane_current_path}}"

# ---- Vim-style pane navigation (prefix + h/j/k/l) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- No-prefix pane focus (Ctrl + arrow) ----
# Note: overrides the shell's Ctrl+Left/Right "jump by word" inside tmux.
bind -n C-Left  select-pane -L
bind -n C-Down  select-pane -D
bind -n C-Up    select-pane -U
bind -n C-Right select-pane -R

# ---- Reload config in place ----
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ---- Persistence: tmux-resurrect + tmux-continuum ----
# Auto-saves session state every 15 min (windows, layouts, cwd, pane content)
# and auto-restores on tmux server start. Survives reboots and crashes.
# Clone plugins to ~/.tmux/plugins/ — install.sh does this on a fresh setup.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'   # save every minute — cheap insurance vs crashes
if-shell "[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]" \
    "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]" \
    "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"

# Continuum's periodic save piggybacks on the tmux status line, which iTerm2's
# -CC integration turns OFF — so the timer may never fire. Save on structural
# changes as well; these hooks run server-side regardless of UI / control mode.
set-hook -g after-new-window   'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh >/dev/null 2>&1"'
set-hook -g after-split-window 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh >/dev/null 2>&1"'
set-hook -g after-kill-pane    'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh >/dev/null 2>&1"'
set-hook -g pane-exited        'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh >/dev/null 2>&1"'
set-hook -g session-created    'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh >/dev/null 2>&1"'
